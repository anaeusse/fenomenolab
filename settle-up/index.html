<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settle Up — Expense Splitter</title>
<style>
  :root {
    --paper: #F6F7F4;
    --card: #FFFFFF;
    --ink: #1B2431;
    --ink-soft: #5B6675;
    --line: #E2E6E0;
    --green: #0F8A5F;
    --green-soft: #E3F3EC;
    --red: #C2452D;
    --red-soft: #FAE9E4;
    --accent: #1B2431;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 20px 64px;
  }

  .wrap { max-width: 1020px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 {
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header h1 .tick { color: var(--green); }
  header p { color: var(--ink-soft); margin-top: 6px; font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }

  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  .row { display: flex; gap: 8px; }

  input, select {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }
  input:focus, select:focus {
    outline: 2px solid var(--green);
    outline-offset: 1px;
    background: #fff;
  }

  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    white-space: nowrap;
    transition: transform 0.06s ease, opacity 0.15s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .btn-ghost {
    background: transparent;
    color: var(--red);
    padding: 4px 8px;
    font-size: 0.85rem;
    font-weight: 500;
  }

  /* People chips */
  .people-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 14px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .chip button {
    background: transparent;
    color: var(--ink-soft);
    padding: 0 6px;
    font-size: 1rem;
    line-height: 1;
  }
  .chip button:hover { color: var(--red); opacity: 1; }

  /* Expense ledger */
  .ledger { margin-top: 14px; font-variant-numeric: tabular-nums; }
  .ledger-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px dashed var(--line);
    font-size: 0.93rem;
  }
  .ledger-item .who { font-weight: 600; }
  .ledger-item .what { color: var(--ink-soft); font-size: 0.85rem; }
  .ledger-item .amt { font-weight: 600; margin-left: auto; }

  .totals {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .totals strong { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Balances */
  .balance-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 4px;
    border-bottom: 1px dashed var(--line);
    font-size: 0.93rem;
    font-variant-numeric: tabular-nums;
  }
  .balance-row .name { font-weight: 600; }
  .pos { color: var(--green); font-weight: 600; }
  .neg { color: var(--red); font-weight: 600; }
  .zero { color: var(--ink-soft); }

  /* Transfers — the signature */
  .transfer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    background: var(--green-soft);
    border: 1px solid #C8E6D8;
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 10px;
    animation: slideIn 0.25s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .transfer { animation: none; }
  }
  .transfer .from { font-weight: 700; text-align: right; }
  .transfer .to { font-weight: 700; }
  .transfer .arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .transfer .arrow .amt {
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 0.88rem;
    padding: 4px 12px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .transfer .arrow svg { color: var(--green); }

  .empty {
    color: var(--ink-soft);
    font-size: 0.9rem;
    padding: 14px 0;
  }

  .settle-note {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .all-settled {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 14px 16px;
    background: var(--green-soft);
    border-radius: 12px;
    color: var(--green);
    font-weight: 600;
  }

  .field-label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .expense-form { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 4px; }
  .expense-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .clear-all {
    background: transparent;
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 4px 0;
    text-decoration: underline;
  }
  .clear-all:hover { color: var(--red); }

  .top-controls {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .top-controls label { font-size: 0.82rem; color: var(--ink-soft); }
  .top-controls input { width: 70px; text-align: center; padding: 6px 8px; }

  .lang-switch {
    margin-right: auto;
    display: flex;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .lang-switch a, .lang-switch .active {
    padding: 4px 12px;
    border-radius: 999px;
    text-decoration: none;
  }
  .lang-switch .active { background: var(--accent); color: #fff; }
  .lang-switch a { color: var(--ink-soft); border: 1px solid var(--line); }
  .lang-switch a:hover { color: var(--ink); background: #fff; }
</style>
</head>
<body>
<script>
(function () {
  var pref = localStorage.getItem('settleup-lang');
  if (pref === 'es' || (!pref && (navigator.language || '').toLowerCase().indexOf('es') === 0)) {
    location.replace('es/');
  }
})();
</script>
<div class="wrap">
  <header>
    <h1>Settle Up <span class="tick">✓</span></h1>
    <p>Add people, log what each person paid, and get the fewest transfers to make everyone even.</p>
  </header>

  <div class="top-controls">
    <nav class="lang-switch" aria-label="Language">
      <span class="active">EN</span>
      <a href="es/" onclick="localStorage.setItem('settleup-lang','es')">ES</a>
    </nav>
    <label for="currency">Currency symbol</label>
    <input id="currency" type="text" value="$" maxlength="4" aria-label="Currency symbol">
  </div>

  <div class="grid">
    <!-- LEFT COLUMN -->
    <div style="display:flex; flex-direction:column; gap:20px;">
      <section class="card">
        <h2>People</h2>
        <div class="row">
          <input id="nameInput" type="text" placeholder="Name (e.g. Ana)" aria-label="Person name">
          <button id="addPersonBtn">Add person</button>
        </div>
        <div class="people-list" id="peopleList"></div>
      </section>

      <section class="card">
        <h2>Expenses</h2>
        <div class="expense-form">
          <div>
            <label class="field-label" for="payerSelect">Paid by</label>
            <select id="payerSelect" aria-label="Who paid"></select>
          </div>
          <div class="row2">
            <div>
              <label class="field-label" for="amountInput">Amount</label>
              <input id="amountInput" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
            <div>
              <label class="field-label" for="descInput">Description (optional)</label>
              <input id="descInput" type="text" placeholder="Dinner, taxi…">
            </div>
          </div>
          <button id="addExpenseBtn">Log expense</button>
        </div>

        <div class="ledger" id="ledger"></div>
        <div class="totals" id="totals" hidden>
          <span>Total: <strong id="totalAmt"></strong></span>
          <span>Per person: <strong id="shareAmt"></strong></span>
        </div>
      </section>
    </div>

    <!-- RIGHT COLUMN -->
    <div style="display:flex; flex-direction:column; gap:20px;">
      <section class="card">
        <h2>Balances</h2>
        <div id="balances"><p class="empty">Balances will appear here once you add people and expenses.</p></div>
      </section>

      <section class="card">
        <h2>Who pays whom</h2>
        <div id="transfers"><p class="empty">The settlement plan will appear here.</p></div>
        <p class="settle-note" id="settleNote" hidden></p>
      </section>

      <button class="clear-all" id="clearAll">Clear everything and start over</button>
    </div>
  </div>
</div>

<script>
(function () {
  let people = [];          // [{ id, name }]
  let expenses = [];        // [{ id, personId, amount, desc }]
  let nextId = 1;

  const $ = (id) => document.getElementById(id);
  const nameInput = $('nameInput');
  const payerSelect = $('payerSelect');
  const amountInput = $('amountInput');
  const descInput = $('descInput');
  const currencyInput = $('currency');

  function fmt(n) {
    const sym = currencyInput.value || '$';
    const sign = n < 0 ? '-' : '';
    return sign + sym + Math.abs(n).toLocaleString(undefined, {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
  }

  // ---------- People ----------
  function addPerson() {
    const name = nameInput.value.trim();
    if (!name) return;
    if (people.some(p => p.name.toLowerCase() === name.toLowerCase())) {
      nameInput.value = '';
      nameInput.placeholder = 'That name is already added';
      return;
    }
    people.push({ id: nextId++, name });
    nameInput.value = '';
    nameInput.placeholder = 'Name (e.g. Ana)';
    render();
    nameInput.focus();
  }

  function removePerson(id) {
    people = people.filter(p => p.id !== id);
    expenses = expenses.filter(e => e.personId !== id);
    render();
  }

  // ---------- Expenses ----------
  function addExpense() {
    const personId = parseInt(payerSelect.value, 10);
    const amount = parseFloat(amountInput.value);
    if (!personId || isNaN(amount) || amount <= 0) return;
    expenses.push({ id: nextId++, personId, amount, desc: descInput.value.trim() });
    amountInput.value = '';
    descInput.value = '';
    render();
    amountInput.focus();
  }

  function removeExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    render();
  }

  // ---------- Settlement (greedy min-transfer) ----------
  function computeBalances() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    const share = people.length ? total / people.length : 0;
    const balances = people.map(p => {
      const paid = expenses.filter(e => e.personId === p.id)
                           .reduce((s, e) => s + e.amount, 0);
      return { name: p.name, paid, balance: paid - share };
    });
    return { total, share, balances };
  }

  function computeTransfers(balances) {
    const EPS = 0.005;
    const creditors = balances.filter(b => b.balance > EPS)
      .map(b => ({ name: b.name, amt: b.balance }))
      .sort((a, b) => b.amt - a.amt);
    const debtors = balances.filter(b => b.balance < -EPS)
      .map(b => ({ name: b.name, amt: -b.balance }))
      .sort((a, b) => b.amt - a.amt);

    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].amt, creditors[j].amt);
      transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: pay });
      debtors[i].amt -= pay;
      creditors[j].amt -= pay;
      if (debtors[i].amt <= EPS) i++;
      if (creditors[j].amt <= EPS) j++;
    }
    return transfers;
  }

  // ---------- Rendering ----------
  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function render() {
    // People chips
    const pl = $('peopleList');
    pl.innerHTML = people.map(p =>
      `<span class="chip">${esc(p.name)}<button aria-label="Remove ${esc(p.name)}" data-remove-person="${p.id}">×</button></span>`
    ).join('') || '<p class="empty">No people yet — add at least two.</p>';

    // Payer dropdown
    const prev = payerSelect.value;
    payerSelect.innerHTML = people.length
      ? people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')
      : '<option value="">Add people first</option>';
    if (people.some(p => String(p.id) === prev)) payerSelect.value = prev;

    // Ledger
    const ledger = $('ledger');
    if (expenses.length) {
      ledger.innerHTML = expenses.map(e => {
        const person = people.find(p => p.id === e.personId);
        return `<div class="ledger-item">
          <span><span class="who">${esc(person.name)}</span>
          ${e.desc ? `<span class="what"> · ${esc(e.desc)}</span>` : ''}</span>
          <span class="amt">${fmt(e.amount)}</span>
          <button class="btn-ghost" aria-label="Remove expense" data-remove-expense="${e.id}">remove</button>
        </div>`;
      }).join('');
    } else {
      ledger.innerHTML = '<p class="empty">No expenses logged yet.</p>';
    }

    // Balances + transfers
    const { total, share, balances } = computeBalances();
    $('totals').hidden = !expenses.length || !people.length;
    if (expenses.length && people.length) {
      $('totalAmt').textContent = fmt(total);
      $('shareAmt').textContent = fmt(share);
    }

    const balEl = $('balances');
    if (people.length && expenses.length) {
      balEl.innerHTML = balances.map(b => {
        const cls = b.balance > 0.005 ? 'pos' : b.balance < -0.005 ? 'neg' : 'zero';
        const label = b.balance > 0.005 ? 'gets back' : b.balance < -0.005 ? 'owes' : 'even';
        return `<div class="balance-row">
          <span class="name">${esc(b.name)}</span>
          <span class="${cls}">${label === 'even' ? 'even' : label + ' ' + fmt(Math.abs(b.balance))}</span>
        </div>`;
      }).join('');
    } else {
      balEl.innerHTML = '<p class="empty">Balances will appear here once you add people and expenses.</p>';
    }

    const trEl = $('transfers');
    const note = $('settleNote');
    note.hidden = true;
    if (people.length >= 2 && expenses.length) {
      const transfers = computeTransfers(balances);
      if (transfers.length) {
        trEl.innerHTML = transfers.map(t =>
          `<div class="transfer">
            <span class="from">${esc(t.from)}</span>
            <span class="arrow">
              <span class="amt">${fmt(t.amount)}</span>
              <svg width="42" height="12" viewBox="0 0 42 12" fill="none" aria-hidden="true">
                <path d="M0 6h38m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="to">${esc(t.to)}</span>
          </div>`
        ).join('');
        note.textContent = `${transfers.length} transfer${transfers.length > 1 ? 's' : ''} needed — that's the minimum with this method.`;
        note.hidden = false;
      } else {
        trEl.innerHTML = `<div class="all-settled">✓ Everyone is already even — nothing to transfer.</div>`;
      }
    } else {
      trEl.innerHTML = '<p class="empty">The settlement plan will appear here.</p>';
    }
  }

  // ---------- Events ----------
  $('addPersonBtn').addEventListener('click', addPerson);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPerson(); });

  $('addExpenseBtn').addEventListener('click', addExpense);
  amountInput.addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });
  descInput.addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });

  currencyInput.addEventListener('input', render);

  $('clearAll').addEventListener('click', () => {
    if (confirm('Remove all people and expenses?')) {
      people = []; expenses = []; render();
    }
  });

  document.body.addEventListener('click', e => {
    const rp = e.target.closest('[data-remove-person]');
    if (rp) removePerson(parseInt(rp.dataset.removePerson, 10));
    const re = e.target.closest('[data-remove-expense]');
    if (re) removeExpense(parseInt(re.dataset.removeExpense, 10));
  });

  render();
})();
</script>
</body>
</html>
